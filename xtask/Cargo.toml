[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
alloy = "2.4.1"
alloy-json-rpc = "2.4.1"
anyhow = "1.0.104"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3.34"
rm-uniswap = { path = ".." }
ruint = "1.18.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = "0.5.3"
url = "2.5.8"
